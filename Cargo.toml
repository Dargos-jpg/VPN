[workspace]
resolver = "2"
members = ["proto", "control", "server", "client"]
# fuzz/ (nightly) si gui/ (tauri, doar pe desktop) sunt workspace-uri separate
exclude = ["fuzz", "gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
vpn-proto = { path = "proto" }
vpn-control = { path = "control" }

# protocol
snow = "0.9.6"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
hkdf = "0.12"
blake2 = "0.10"
rand = "0.8"
data-encoding = "2"
base64 = "0.22"
thiserror = "1"
zeroize = { version = "1", features = ["derive"] }

# binare
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = "0.7"
toml = "0.8"
qrcode = { version = "0.14", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util"] }
tun-rs = { version = "2.8", features = ["async"] }
